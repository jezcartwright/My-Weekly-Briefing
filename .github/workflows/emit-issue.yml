name: Emit Issue JSON to Firestore (manual)

# Writes a week's 24 topics from index.html into Firestore issues/{date},
# in the shape the `topic` Cloud Function reads, so /t/<date>-<cat>-<pos>
# share links render the real article and unfurl with its title.
#
# Manual only for now. Run it to backfill a week:
#   - issue_date = 2026-09-14  -> writes issues/2026-09-14 (this week)
#   - leave issue_date blank + week_offset = 1 -> last Monday, etc.
# Reuses the same FIREBASE_SERVICE_ACCOUNT secret the Monday publish uses.

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Explicit Monday date YYYY-MM-DD (leave blank to use week_offset)'
        required: false
        default: ''
      week_offset:
        description: '0 = current week, 1 = last week, ... (used only if issue_date is blank)'
        required: false
        default: '0'

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node (for extracting the D.* topic arrays)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Emit issue JSON to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ISSUE_DATE: ${{ github.event.inputs.issue_date }}
          WEEK_OFFSET: ${{ github.event.inputs.week_offset }}
        run: python emit_issue.py
