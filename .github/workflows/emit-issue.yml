name: Emit Issue JSON to Firestore (manual)

# Writes a week's 24 topics from index.html into Firestore issues/{date},
# in the shape the `topic` Cloud Function reads, so the public per-topic
# share pages (/t/<date>-<category>-<n>) render the article and unfurl
# with its title.
#
# This matches emit_issue.py on main: it authenticates with GMAIL_SA_JSON
# (the same service account the Monday publish uses, which has Firestore
# access) and selects the week with WEEK_OFFSET:
#   week_offset = 0  -> current week's Monday (this week)
#   week_offset = 1  -> last Monday, and so on (backfill past weeks)

on:
  workflow_dispatch:
    inputs:
      week_offset:
        description: 'Weeks back to emit (0 = current week, 1 = last week, ...)'
        required: false
        default: '0'

jobs:
  emit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node (for extracting the D.* topic arrays)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Emit issue JSON to Firestore
        env:
          GMAIL_SA_JSON: ${{ secrets.GMAIL_SA_JSON }}
          WEEK_OFFSET: ${{ github.event.inputs.week_offset }}
        run: python emit_issue.py
